# UAT application-release override. Keep the stateful UAT compose file intact;
# only the stateless AgentCiCi application services use the immutable release tag.
#
# Required at deployment time (do not put these values in the managed secret file):
#   CICI_IMAGE_TAG=<release-version>
#   CICI_APP_VERSION=<release-version>
# Optional:
#   ACR_IMAGE_PREFIX=op-registry.cloudcc.cn/cloudcc-ai-native
services:
  backend:
    image: ${ACR_IMAGE_PREFIX:-op-registry.cloudcc.cn/cloudcc-ai-native}/cici-backend:${CICI_IMAGE_TAG:?set CICI_IMAGE_TAG}
    environment:
      CICI_APP_VERSION: ${CICI_APP_VERSION:?set CICI_APP_VERSION}
      APP_SEMATTICE_CONSOLE_BASE_URL: ${APP_SEMATTICE_CONSOLE_BASE_URL:-https://uat.agentcici.com}
      # Keep the public homepage widget disabled unless UAT operations explicitly
      # selects a published widget key in the root-only environment file.
      APP_WEBSITE_WIDGET_DEFAULT_KEY: ${APP_WEBSITE_WIDGET_DEFAULT_KEY:-}
      # Tenant HUMAN access must cover the AI table metadata catalog and governed
      # record operations. Principal projection uses its dedicated server-only token.
      APP_AUTH_OFFICIAL_ACCESS_SEMATTICE_SCOPES: ${APP_AUTH_OFFICIAL_ACCESS_SEMATTICE_SCOPES:-metadata.read,runtime.record.read,runtime.record.create,runtime.record.update}
      APP_AUTH_OFFICIAL_ACCESS_SEMATTICE_SERVICE_SCOPES: ${APP_AUTH_OFFICIAL_ACCESS_SEMATTICE_SERVICE_SCOPES:-identity.principal.sync,runtime.record.read,runtime.record.create,runtime.record.update}

  frontend:
    image: ${ACR_IMAGE_PREFIX:-op-registry.cloudcc.cn/cloudcc-ai-native}/cici-frontend:${CICI_IMAGE_TAG:?set CICI_IMAGE_TAG}
