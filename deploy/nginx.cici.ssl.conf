server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    return 204;
}

server {
    listen 80;
    server_name agentcici.com agentaicc.com agentcici.salesforchina.com onechat.agentcici.com x.agentcici.com;
    root /usr/share/nginx/html;

    location ~ ^/WW_verify_[A-Za-z0-9]+\.txt$ {
        try_files $uri =404;
    }

    location /wecom/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/agentcici.com.pem;
    ssl_certificate_key /etc/nginx/certs/agentcici.com.key;

    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name agentcici.com onechat.agentcici.com x.agentcici.com;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $backend_upstream http://backend:8080;
    set $devautopilot_upstream dev-autopilot:4177;

    ssl_certificate /etc/nginx/certs/agentcici.com.pem;
    ssl_certificate_key /etc/nginx/certs/agentcici.com.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:CICI_SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # DEV Autopilot remains independently deployable and only shares this
    # authenticated application entrypoint and Docker network with AgentCiCi.
    location = /devautopilot {
        return 301 /devautopilot/;
    }

    location ^~ /devautopilot/ {
        rewrite ^/devautopilot/(.*)$ /$1 break;
        proxy_pass http://$devautopilot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /devautopilot;
    }

    # The SPA entry must be revalidated on every navigation.  Otherwise a browser
    # can retain an old index.html and keep executing a pre-fix tenant-state bundle.
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ^~ /agent-docs/ {
        types { text/markdown md; }
        default_type text/markdown;
        charset utf-8;
        expires -1;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        expires -1;
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /.well-known/agentcici-oact-jwks.json {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /embed/v1/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/platform {
        rewrite ^ /platform break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/platform/ {
        rewrite ^/api/platform/(.*)$ /platform/$1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /skills/authoring/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the route-level platform page on the SPA while forwarding only
    # evaluation API subpaths to the backend.
    location ~ ^/(evaluation|platform/evaluation)/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/semantic-query(/|$) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Browser APIs use /api/admin while /admin remains exclusively owned by
    # the SPA. This prevents a hard refresh from rendering a backend 401 JSON.
    location ~ ^/api/admin(/|$) {
        rewrite ^/api(/admin/.*)$ $1 break;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(internal|auth|kb|ops|models|tools|integrations|mcp-servers|customer-workbench|ai-table|admin/autoservice|api/autoservice|agents|skills|feishu|wecom|me)(/|$) {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
