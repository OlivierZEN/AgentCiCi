  - "实现 FEAT-145 的 AgentCiCi 主数据、受控人类邀请、Keycloak 绑定、机器主体与人类责任治理。"
  - "实现必要的 API、迁移、测试、运行配置和官方应用契约；保持 UUID、issuer+sub、company_id 与既有 OACT/JWKS 的兼容边界。"
