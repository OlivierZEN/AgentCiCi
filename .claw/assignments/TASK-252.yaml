  - "修复 CloudCC CRM 集成的组织 ID 配置语义：AgentCiCi 租户外键仍为 company_id；CloudCC 配置与 Token 请求统一使用 orgId，允许正向迁移和兼容旧 companyId 读取。"
  - "修复公司切换数据隔离的前端旧工件缓存与实时流作用域：入口 HTML 不得缓存，带内容哈希的静态资源可长期缓存；旧公司 SSE/轮询回调不得触发当前公司的任何会话读取或状态写入。"
