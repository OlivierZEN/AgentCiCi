      .active { fill: #fffaf0; stroke: #b99652; stroke-width: 1.2; }
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; fill: #2b2217; }
      .muted { fill: #7c6d59; }
      .bronze { fill: #876223; }
      .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
      .title { font-size: 24px; font-weight: 650; }
      .h2 { font-size: 14px; font-weight: 650; }
      .body { font-size: 13px; font-weight: 550; }
      .small { font-size: 11px; font-weight: 600; }
      .metric { font-size: 22px; font-weight: 700; }
      .chip { fill: #faf4e8; stroke: #ded2bb; stroke-width: 1; }
      .gold-fill { fill: #a67c2f; }
      .running { fill: #fff8df; stroke: #c9b16f; }
      .running-text { fill: #8a5c00; }
      .ok { fill: #f1f7ea; stroke: #c7dfb8; }
      .ok-text { fill: #166534; }
      .danger { fill: #fff3ef; stroke: #efc7bc; }
      .danger-text { fill: #b42318; }
      .line { stroke: #ded2bb; stroke-width: 1; }
      .gold-line { stroke: #b99652; stroke-width: 2; }
