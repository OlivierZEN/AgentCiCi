spring:
  application:
    name: cc-cici-assistant-backend
  servlet:
    multipart:
      max-file-size: 256MB
      max-request-size: 256MB
  datasource:
    url: jdbc:postgresql://localhost:5432/agentcici
    username: cici
    password: cici123
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    postgresql:
      transactional-lock: false
  rabbitmq:
    host: localhost
    port: 5672
    username: cici
    password: cici123

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

info:
  app:
    name: AgentCiCi
    version: ${CICI_APP_VERSION:dev}
    image-tag: ${CICI_IMAGE_TAG:${CICI_APP_VERSION:dev}}
    git-commit: ${GIT_COMMIT:unknown}

app:
  auth:
    jwt-secret: "change-me-in-prod-change-me-in-prod-2026"
    jwt-expiration-seconds: 7200
    # Demo org-admin mobiles for local and README examples; override in prod (e.g. APP_AUTH_BOOTSTRAP_ADMIN_MOBILES).
    bootstrap-admin-mobiles: "13800138111,13900009999"
    platform-admin-mobiles: "13800138111"
    platform-operator-mobiles: ""
    platform-support-mobiles: ""
    platform-billing-mobiles: ""
    platform-auditor-mobiles: ""
    sms:
      store: memory
      # When false, send-window and per-day SMS caps are skipped (useful for integration tests).
      rate-limit-enabled: true
    official-access:
      # Enables only after the production ACS signing key and Semattice capability allow-list are set.
      enabled: false
      issuer: ""
      key-id: ""
      private-key-pkcs8-base64: ""
      ttl-seconds: 600
      semattice-scopes: []
    oidc:
      # Set only after the Keycloak client redirect URI, secret and account mappings are ready.
      enabled: false
      issuer: ""
      client-id: agentcici-bff
      client-secret: ""
      redirect-uri: ""
      service-token-exchange:
        # Accepts a Keycloak client-credentials token only at the OACT exchange boundary.
        # Keep disabled until service principals, OACT signing and Semattice JWKS trust are deployed.
        enabled: false
      provisioning:
        # In production this is enabled with the confidential client that has
        # realm-management users/query-users/manage-users only. Do not reuse the BFF client.
        enabled: false
        admin-client-id: ""
        admin-client-secret: ""
        invitation-redirect-uri: ""
  agent-open-api:
    enabled: false
    conversation-api-enabled: true
    key-pepper: ""
    default-rate-limit-per-minute: 60
    default-daily-quota: 1000
    default-max-prompt-chars: 8000
    default-max-response-chars: 12000
    default-timeout-ms: 120000
    cors-allowed-origins: ["*"]
    cors-allowed-origin-patterns: []
    cors-max-age-seconds: 3600
  agent-runtime:
    plan-exec:
      # P2 canary is server-owned and disabled until an exact test Agent is allowlisted.
      enabled: false
      allowed-agent-ids: []
    mode-router:
      # P3 is also server-owned. Both this and plan-exec must match before a durable plan starts.
      enabled: false
      allowed-agent-ids: []
      max-react-tool-rounds: 3
      max-steps: 6
      max-replans: 1
      max-reflect-rounds: 1
    reflect:
      # P4 is a server-owned, read-only review gate and remains disabled by default.
      enabled: false
      allowed-agent-ids: []
      max-rounds: 1
  kb:
    indexing:
      mode: local
    vector-store: memory
    embedding:
      provider: local
      model: local-hash
      dimension: 1024
    qdrant:
      base-url: http://localhost:6333
      collection: cici_kb_chunk
      api-key: ""
  voice:
    iflytek:
      enabled: false
      app-id: ""
      access-key-id: ""
      access-key-secret: ""
      realtime-url: "wss://office-api-ast-dx.iflyaisol.com/ast/communicate/v1"
      lang: "autodialect"
      domain: "com"

cici:
  tool:
    tavily:
      # NOTE: API keys for Tavily are intentionally NOT configured here.
      # They are managed per-tenant under "集成应用 → Tavily" (integration_app, encrypted).
      api-base: https://api.tavily.com
      default-max-results: 5
      default-search-depth: basic
      default-topic: general
      default-include-answer:   # omit by default; Tavily treats omitted as false
      default-extract-format: markdown
      max-extract-chars: 20000
      per-session-limit: 10
      timeout: 10s
