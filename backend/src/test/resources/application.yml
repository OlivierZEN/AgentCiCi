# Merge with main application.yml: integration tests use PostgreSQL, not H2.
spring:
  datasource:
    url: ${TEST_DATABASE_URL:jdbc:postgresql://localhost:5432/agentcici_test}
    username: ${TEST_DATABASE_USERNAME:cici}
    password: ${TEST_DATABASE_PASSWORD:cici123}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    postgresql:
      transactional-lock: false

app:
  auth:
    bootstrap-platform-account:
      governance-company-id: "demo-org"
    jwt-secret: "change-me-in-prod-change-me-in-prod-2026"
    jwt-expiration-seconds: 7200
    official-access:
      enabled: true
      issuer: "https://identity.example.test"
      key-id: "test-oact-1"
      private-key-pkcs8-base64: ""
      ttl-seconds: 600
      semattice-scopes:
        - metadata.read
        - runtime.record.read
        - runtime.record.create
        - runtime.record.update
    ecosystem-access:
      ttl-seconds: 7200
    bootstrap-admin-mobiles: "13800138111,13800138000,13800138001,13800138002,13800138003,13800138188,13800138006"
    platform-admin-mobiles: "13800138111"
    platform-operator-mobiles: ""
    platform-support-mobiles: ""
    platform-billing-mobiles: ""
    platform-auditor-mobiles: ""
    sms:
      # Integration tests call /auth/sms/send many times per JVM; disable send-window / daily caps in test.
      rate-limit-enabled: false
  agent-open-api:
    enabled: true
    key-pepper: "test-agent-open-api-pepper-2026"
