<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>客户互动工作台</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #fffdf8;
        color: #2b2217;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      .page {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100vh;
        min-height: 720px;
        background: #fffdf8;
      }

      .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 56px;
        padding: 10px 18px;
        border-bottom: 1px solid #ded2bb;
        background: #faf4e8;
        box-sizing: border-box;
      }

      .title {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }

      h1 {
        margin: 0;
        color: #2b2217;
        font-size: 18px;
        line-height: 1.3;
        font-weight: 700;
      }

      .status {
        color: #876223;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }

      .open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        height: 34px;
        padding: 0 14px;
        border: 1px solid #a67c2f;
        border-radius: 8px;
        background: #a67c2f;
        color: #fffdf8;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      iframe {
        flex: 1 1 auto;
        width: 100%;
        min-height: 0;
        border: 0;
        background: #fffdf8;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="bar">
        <div class="title">
          <h1>客户互动工作台</h1>
          <span class="status">AgentCiCi 已连接</span>
        </div>
        <a class="open" href="https://x.agentcici.com/app?aiApp=customer-workbench" target="_blank" rel="noopener">新窗口打开</a>
      </header>
      <iframe
        src="https://x.agentcici.com/app?aiApp=customer-workbench"
        title="客户互动工作台"
        allow="microphone; clipboard-read; clipboard-write"
      ></iframe>
    </main>
  </body>
</html>
